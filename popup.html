<!DOCTYPE html>
<html>
<head>
  <title>Nextera Paste</title>
  <style>
    body {
      width: 300px;
      padding: 10px;
      font-family: Arial, sans-serif;
      margin: 0;
    }
    textarea {
      width: 100%;
      height: 100px;
      margin-bottom: 10px;
      resize: vertical;
      box-sizing: border-box;
    }
    button {
      width: 100%;
      padding: 8px;
      background-color: #4285f4;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
    }
    button:hover {
      background-color: #3b78e7;
    }
    button:disabled {
      background-color: #a0a0a0;
      cursor: not-allowed;
    }
    .status {
      margin-top: 10px;
      color: #666;
      font-size: 12px;
      min-height: 16px;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
    }
    .header h2 {
      margin: 0;
      font-size: 18px;
    }
    .github-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 28px;
      height: 28px;
      color: #333;
      text-decoration: none;
      border-radius: 50%;
      transition: background-color 0.2s, color 0.2s;
    }
    .github-link:hover {
      background-color: #f0f0f0;
      color: #000;
    }
    .github-link svg {
      width: 20px;
      height: 20px;
      fill: currentColor;
    }
    .footer {
      margin-top: 12px;
      padding-top: 8px;
      border-top: 1px solid #eee;
      font-size: 11px;
      color: #999;
      text-align: center;
    }
    .footer a {
      color: #4285f4;
      text-decoration: none;
    }
    .footer a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="header">
